stages:
  - deploy_dev

deploy_dev:
  image: alpine/ansible:latest
  stage: deploy_dev
  before_script:
    - apk add --no-cache openssh-client sshpass
    - ssh-keyscan -H "${DEPLOY_DEV_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
    - ssh-keyscan -H "${DEPLOY_PROD_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ANSIBLE_ROLES_PATH=ansible/roles \
      ANSIBLE_HOST_KEY_CHECKING=False \
      ansible-playbook -i ansible/inventory/dev.yaml ansible/playbooks/deploy.yml \
        --extra-vars "docker_image=nginx:mainline-alpine3.24-slim"
  tags:
    - simple-runner