- name: Create nginx config directory
  ansible.builtin.file:
    path: /opt/app/nginx
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Deploy nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/app/nginx/nginx.conf
    owner: ubuntu
    group: ubuntu
    mode: '0644'